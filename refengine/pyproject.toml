[project]
name = "tend-ref"
version = "0.1.0"
description = "Python reference implementation of the Tend law engine (docs/SPEC.md)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tend_ref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
