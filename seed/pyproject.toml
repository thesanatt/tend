[project]
name = "tend-seed"
version = "0.1.0"
description = "Fictional Nessie personas, the seeder, and the bank-layer tests for Tend"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "google-genai>=1.0",
    "reportlab>=4.0",
]

[dependency-groups]
dev = ["pytest>=8", "pypdf>=4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "../api"]
testpaths = ["tests"]
