[project]
name = "tend-agent"
version = "0.1.0"
description = "Tend Navigator: a Fetch.ai uAgent on the Agent Chat Protocol for crime victim compensation questions, Checks, and a confirm-coded demo payment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "uagents==0.25.5",       # 0.26 breaks the chat and mailbox APIs this agent uses
    "uagents-core==0.4.11",  # ships the Interactive Card models and helpers
    "httpx>=0.28.1,<0.29",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tend_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
