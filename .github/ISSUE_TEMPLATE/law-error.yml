# "Report an error on this page" on each state page (/mi) and law page (/law/MI) opens this form with the
# jurisdiction and the page filled in (web/components/public/corrections.ts). Field ids are the query keys.
name: Report an error in the law data
description: A date, amount, or rule on a Tend page that does not match the official source.
title: "Law error: "
body:
  - type: markdown
    attributes:
      value: |
        What you write here becomes a public page with your GitHub username on it. Anyone can read it.

        Please do not include your name, your story, or anything about your own case or anyone else's. Only say what the Tend page says and what the official source says.
  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction
      description: The two-letter code, like MI or DC.
      placeholder: MI
    validations:
      required: true
  - type: input
    id: page_url
    attributes:
      label: Page URL
      description: The Tend page that shows the error.
      placeholder: https://youreowed.tech/mi
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule id (optional)
      description: The id next to the rule on the law page, like MI-EXAM-1.
      placeholder: MI-EXAM-1
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What the Tend page says, and what the law says instead.
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: The official source that shows it
      description: A link to the statute, regulation, or program page.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: source_text
    attributes:
      label: The sentence in that source
      description: Copy it word for word, so it can be checked against the source.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have not included anything about myself or anyone's case
          required: true
